[project]
name = "agent-eval-kit"
version = "0.1.0"
description = "Evaluate AI agents with YAML test cases, repeated runs, deterministic checkers and OpenTelemetry."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jean Cassiano" }]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "ruff==0.14.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
# Copied from indigotech/br-taqtile-observability; left unformatted so the two copies stay diffable.
extend-exclude = ["sensors", "tests/test_sensors.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

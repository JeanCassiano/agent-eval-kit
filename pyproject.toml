[project]
name = "agent-eval-kit"
version = "0.1.0"
description = "Evaluate AI agents with YAML test cases, repeated runs, deterministic checkers and OpenTelemetry."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jean Cassiano" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "mutmut==3.3.1",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "ruff==0.14.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
# Copied from indigotech/br-taqtile-observability; left unformatted so the two copies stay diffable.
extend-exclude = ["sensors", "tests/test_sensors.py", "mutants"]

[tool.mutmut]
paths_to_mutate = ["src/"]
# mutmut 3.3.1 passes tests_dir to pytest as arguments and has no other option for them. The sensor
# tests load the hooks from sensors/, which mutmut does not copy, and never import src/.
tests_dir = ["tests/", "--ignore=tests/test_sensors.py"]
also_copy = ["examples/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

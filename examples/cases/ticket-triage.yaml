name: ticket-triage
version: "1"
synthetic: true
cases:
  - id: triage-refund
    input: |
      Classify this support ticket. Reply with JSON: {"category": ..., "priority": "low" | "high"}.
      Ticket: "I was charged twice for order #A-1001 and need one charge refunded."
    expected: {category: billing, priority: high}
    check: {type: json_fields}
    tags: [triage]
  - id: triage-password
    input: |
      Classify this support ticket. Reply with JSON: {"category": ..., "priority": "low" | "high"}.
      Ticket: "How do I change my password? No rush."
    expected: {category: account, priority: low}
    check: {type: json_fields}
    tags: [triage]
